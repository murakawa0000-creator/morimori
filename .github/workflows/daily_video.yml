name: 毎日ショート動画自動生成

on:
  schedule:
    # 毎日 UTC 21:00 = 日本時間 朝6:00 に実行
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにする

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: システム依存パッケージ導入（ffmpeg・日本語フォント）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Python依存パッケージ導入
        run: |
          pip install -r requirements.txt

      - name: パイプライン実行（収集→台本→音声→動画）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JP_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
        run: |
          cd src && python main.py

　　　- name: 生成物をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_number }}
          path: |
            src/output/short_video.mp4
            src/output/script.json
            src/output/trends.json
          retention-days: 30
